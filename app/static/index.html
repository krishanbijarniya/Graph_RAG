<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GraphRAG Research Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f7f7f8;
            color: #202123;
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        .sidebar {
            width: 260px;
            background: #202123;
            color: white;
            display: flex;
            flex-direction: column;
            padding: 16px;
        }

        .brand {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .new-chat {
            width: 100%;
            padding: 12px;
            border: 1px solid #565869;
            border-radius: 8px;
            background: transparent;
            color: white;
            cursor: pointer;
            font-size: 14px;
        }

        .new-chat:hover {
            background: #2a2b32;
        }

        .sidebar-info {
            margin-top: auto;
            color: #b4b4b4;
            font-size: 12px;
            line-height: 1.6;
        }

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        .header {
            height: 64px;
            background: white;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            align-items: center;
            padding: 0 28px;
        }

        .header-title {
            font-size: 18px;
            font-weight: 600;
        }

        .status {
            margin-left: 15px;
            font-size: 12px;
            color: #16803c;
        }

        .chat {
            flex: 1;
            overflow-y: auto;
            padding: 30px 20px 120px;
        }

        .welcome {
            max-width: 760px;
            margin: 80px auto;
            text-align: center;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #666;
            font-size: 16px;
        }

        .message {
            max-width: 850px;
            margin: 0 auto 24px;
            display: flex;
            gap: 14px;
        }

        .avatar {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .user-avatar {
            background: #343541;
            color: white;
        }

        .assistant-avatar {
            background: #e8f0fe;
            color: #2563eb;
        }

        .message-content {
            flex: 1;
            line-height: 1.65;
            font-size: 15px;
        }

        .message-role {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .answer {
            white-space: pre-wrap;
        }

        .sources {
            margin-top: 16px;
            border-top: 1px solid #e5e5e5;
            padding-top: 12px;
        }

        .sources-title {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .source {
            display: inline-block;
            background: #f1f1f1;
            border-radius: 6px;
            padding: 5px 8px;
            margin: 3px;
            font-size: 11px;
            color: #555;
        }

        .entities {
            margin-top: 10px;
            color: #666;
            font-size: 12px;
        }

        .input-area {
            position: fixed;
            bottom: 0;
            left: 260px;
            right: 0;
            background: linear-gradient(
                transparent,
                #f7f7f8 30%
            );
            padding: 25px 20px 20px;
        }

        .input-box {
            max-width: 850px;
            margin: 0 auto;
            background: white;
            border: 1px solid #d9d9e3;
            border-radius: 14px;
            display: flex;
            align-items: flex-end;
            padding: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.05);
        }

        textarea {
            flex: 1;
            resize: none;
            border: none;
            outline: none;
            font-size: 15px;
            padding: 8px;
            min-height: 24px;
            max-height: 140px;
            font-family: inherit;
        }

        .send {
            width: 38px;
            height: 38px;
            border: none;
            border-radius: 8px;
            background: #343541;
            color: white;
            cursor: pointer;
        }

        .send:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .typing {
            color: #777;
            font-style: italic;
        }

        @media (max-width: 700px) {
            .sidebar {
                display: none;
            }

            .input-area {
                left: 0;
            }

            .header {
                padding: 0 16px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">

        <div class="brand">
            GraphRAG
        </div>

        <button class="new-chat" onclick="newChat()">
            + New Chat
        </button>

        <div class="sidebar-info">
            Local Research Assistant<br>
            Qdrant + Neo4j + Ollama<br>
            Qwen 2.5 7B
        </div>

    </aside>


    <main class="main">

        <header class="header">

            <div class="header-title">
                Research Assistant
            </div>

            <div class="status">
                ● Local
            </div>

        </header>


        <section class="chat" id="chat">

            <div class="welcome" id="welcome">

                <h1>GraphRAG Research Assistant</h1>

                <p>
                    Ask questions about the indexed research papers.
                </p>

            </div>

        </section>


        <div class="input-area">

            <div class="input-box">

                <textarea
                    id="query"
                    rows="1"
                    placeholder="Ask a question about the research papers..."
                ></textarea>

                <button
                    class="send"
                    id="send"
                    onclick="sendQuery()"
                >
                    ↑
                </button>

            </div>

        </div>

    </main>


<script>

const queryInput = document.getElementById("query");
const sendButton = document.getElementById("send");
const chat = document.getElementById("chat");


queryInput.addEventListener("keydown", function(event) {

    if (event.key === "Enter" && !event.shiftKey) {

        event.preventDefault();

        sendQuery();
    }

});


queryInput.addEventListener("input", function() {

    this.style.height = "auto";

    this.style.height =
        Math.min(this.scrollHeight, 140) + "px";

});


function addMessage(role, content, data = null) {

    const welcome =
        document.getElementById("welcome");

    if (welcome) {
        welcome.remove();
    }


    const message =
        document.createElement("div");

    message.className = "message";


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar " +
        (role === "user"
            ? "user-avatar"
            : "assistant-avatar");

    avatar.textContent =
        role === "user"
            ? "U"
            : "AI";


    const body =
        document.createElement("div");

    body.className = "message-content";


    const roleLabel =
        document.createElement("div");

    roleLabel.className = "message-role";

    roleLabel.textContent =
        role === "user"
            ? "You"
            : "GraphRAG";


    const answer =
        document.createElement("div");

    answer.className = "answer";

    answer.textContent = content;


    body.appendChild(roleLabel);

    body.appendChild(answer);


    if (role === "assistant" && data) {

        if (
            data.query_entities &&
            data.query_entities.length > 0
        ) {

            const entities =
                document.createElement("div");

            entities.className =
                "entities";

            entities.textContent =
                "Entities: " +
                data.query_entities.join(", ");

            body.appendChild(entities);
        }


        if (
            data.citations &&
            data.citations.length > 0
        ) {

            const sources =
                document.createElement("div");

            sources.className =
                "sources";


            const title =
                document.createElement("div");

            title.className =
                "sources-title";

            title.textContent =
                "Sources";

            sources.appendChild(title);


            data.citations.forEach(
                citation => {

                    const source =
                        document.createElement("span");

                    source.className =
                        "source";

                    source.textContent =
                        `${citation.document} · p.${citation.page}`;

                    sources.appendChild(source);
                }
            );


            body.appendChild(sources);
        }
    }


    message.appendChild(avatar);

    message.appendChild(body);

    chat.appendChild(message);


    chat.scrollTop =
        chat.scrollHeight;
}


async function sendQuery() {

    const query =
        queryInput.value.trim();


    if (!query) {
        return;
    }


    addMessage(
        "user",
        query
    );


    queryInput.value = "";

    queryInput.style.height = "auto";

    sendButton.disabled = true;


    const loading =
        document.createElement("div");

    loading.className =
        "message";

    loading.id =
        "loading";


    loading.innerHTML = `
        <div class="avatar assistant-avatar">AI</div>
        <div class="message-content">
            <div class="message-role">GraphRAG</div>
            <div class="typing">Thinking...</div>
        </div>
    `;


    chat.appendChild(loading);

    chat.scrollTop =
        chat.scrollHeight;


    try {

        const response =
            await fetch("/query", {

                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json"
                },

                body: JSON.stringify({
                    query: query
                })

            });


        if (!response.ok) {

            throw new Error(
                "API request failed"
            );
        }


        const data =
            await response.json();


        loading.remove();


        addMessage(
            "assistant",
            data.answer,
            data
        );


    } catch (error) {

        loading.remove();


        addMessage(
            "assistant",
            "Sorry, I couldn't connect to the GraphRAG API."
        );

        console.error(error);

    } finally {

        sendButton.disabled = false;

        queryInput.focus();
    }
}


function newChat() {

    chat.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>GraphRAG Research Assistant</h1>
            <p>
                Ask questions about the indexed research papers.
            </p>
        </div>
    `;

    queryInput.focus();
}

</script>

</body>

</html>
