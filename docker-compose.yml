services:

  graphrag-api:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: graphrag-api

    env_file:
      - .env

    ports:
      - "8000:8000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      - qdrant
      - neo4j

    restart: unless-stopped


  qdrant:
    image: qdrant/qdrant:latest

    container_name: graphrag-qdrant

    ports:
      - "6333:6333"

    volumes:
      - qdrant_data:/qdrant/storage

    restart: unless-stopped


  neo4j:
    image: neo4j:latest

    container_name: graphrag-neo4j

    environment:
      NEO4J_AUTH: neo4j/password

    ports:
      - "7474:7474"
      - "7687:7687"

    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_import:/var/lib/neo4j/import
      - neo4j_plugins:/plugins

    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

    restart: unless-stopped


volumes:

  qdrant_data:

  neo4j_data:

  neo4j_logs:

  neo4j_import:

  neo4j_plugins:
